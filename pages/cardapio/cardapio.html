<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./cardapio.css">
    <link rel="shortcut icon" href="../../assets/mcdonalds.png" type="image/x-icon">
    <script src="./cardapio.js" defer></script>
    <title>McDonald's</title>
</head>

<body>
    <div class="menucarrinho">
        <div class="itemadicionado">
            <img src="../../assets/lanche.png" alt="">
        </div>
    </div>
    <header>
        <div class="headerprincipal">
            <div class="headertopo">
                <div class="titulo">
                    <img src="../../assets/mcdonalds.png" alt="McDonald's">
                    <div>
                        <h1>McDonald's</h1>
                        <p>Faça seu pedido</p>
                    </div>
                </div>

                <button class="sair"><img src="../../assets/exit.png" alt="" onclick="window.location.href='../../index.html'"> Sair</button>
            </div>

            <form class="busca">
                <img src="../../assets/search.png" alt="Buscar">
                <input type="text" placeholder="Buscar produtos...">
            </form>

            <div class="filtros">
                <button type="button">🍔 Todos</button>
                <button type="button">🍔 Lanches</button>
                <button type="button">🍟 Combos</button>
                <button type="button">🍟 Acompanhamentos</button>
                <button type="button">🥤 Bebidas</button>
                <button type="button">🥤 Milk-shakes</button>
                <button type="button">🎉 Ofertas do Dia</button>
            </div>

        </div>

        <div class="outrosbotoes">
            <button class="carrinho"><img src="../../assets/cart.png" alt=""></button>
        </div>
    </header>

    <main>
    </main>
</body>

</html>
